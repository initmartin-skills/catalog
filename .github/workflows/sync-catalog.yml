name: Sync skills and publish
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Rescan all forks, ignoring the incremental cache
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'sources.json'
      - 'discovered.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: catalog-publish
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.commit.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Test scanner and merge behavior
        run: python3 -m unittest discover -s tests -v
      - name: Discover public skills
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_REFRESH: ${{ inputs.refresh || false }}
        run: |
          if [ "$SCAN_REFRESH" = "true" ]; then
            python3 scripts/discover_skills.py --refresh
          else
            python3 scripts/discover_skills.py
          fi
      - name: Build and validate the catalog
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_catalog.py --check
          python3 -m unittest discover -s tests -v
      - name: Save discovery results
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discovered.json README.md index.html
          changed=false
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public skill discovery'
            git push origin HEAD:main
            changed=true
          fi
          if [ "$changed" = "true" ] || [ "$EVENT_NAME" != "schedule" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare public website
        if: steps.commit.outputs.publish == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: steps.commit.outputs.publish == 'true'
        with:
          path: _site
  deploy:
    if: needs.sync.outputs.publish == 'true'
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
